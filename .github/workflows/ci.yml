name: Playwright UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright Chromium and system dependencies
        run: mvn --batch-mode exec:java -Dexec.args="install --with-deps chromium"

      - name: Run TestNG suite
        run: mvn --batch-mode clean test -Dplaywright.headless=true -Dplaywright.browser=chromium

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-report.html
          if-no-files-found: error
